name: Despertador de la actualización

# Actualización 46: GitHub no garantiza los horarios programados. Desde el 19/11/2026 la actualización «cada 6 horas»
# corría solo 2 o 3 veces por día y los precios llegaron a tener 13 horas. Este proceso liviano (no lee tiendas) revisa
# una vez por hora la fecha de los precios publicados y, SOLO si tienen más de 6 horas y no hay otra actualización en
# curso, arranca «Actualizar precios y publicar». Así las tiendas no reciben más pedidos que antes.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: despertador
  cancel-in-progress: true

jobs:
  revisar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - name: ¿Hace falta actualizar?
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          URL: https://kyranohard.com.ar/data/meta.json
        run: bash scripts/despertador.sh
