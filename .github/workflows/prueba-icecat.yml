name: Prueba Icecat notebooks (no publica)
on:
  push:
    branches: [prueba-icecat]
permissions:
  contents: read
jobs:
  icecat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 scripts/diagnostico_icecat_notebooks.py | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          ICECAT_USER: ${{ secrets.ICECAT_USER }}
      - uses: actions/upload-artifact@v7
        with:
          name: icecat-notebooks
          path: icecat_notebooks.json
