name: Limpiar archivos sueltos

# Actualización 38. Antes este flujo MOVÍA archivos de la raíz a su carpeta: con copias viejas sueltas en la raíz,
# eso podía pisar las versiones nuevas. Ahora solo BORRA una copia suelta cuando la versión buena ya existe en su
# lugar (nunca mueve ni reemplaza nada). Se ejecuta al guardar este archivo o con el botón «Run workflow».

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ordenar.yml"

permissions:
  contents: write

jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Borrar copias sueltas de la raíz
        run: |
          borrar_si() {   # borrar_si <copia suelta> <ubicación correcta>
            if [ -f "$1" ] && [ -f "$2" ]; then git rm -q "$1"; echo "borrada: $1 (queda $2)"; fi
          }
          borrar_si actualizar.yml       .github/workflows/actualizar.yml
          borrar_si resumen.yml          .github/workflows/resumen.yml
          for f in preguntas.html privacidad.html producto.html productos.html robots.txt sitemap.xml terminos.html tiendas.html; do
            borrar_si "$f" "site/$f"
          done
          borrar_si supabase-2.117.3.js  site/js/vendor/supabase-2.117.3.js
          borrar_si supabase.LICENSE.txt site/js/vendor/supabase.LICENSE.txt
          borrar_si test_all.py          tests/test_all.py
          # «download» es el .gitignore que se subió con otro nombre
          if [ -f download ] && grep -q "__pycache__" download; then
            if [ ! -f .gitignore ]; then git mv download .gitignore; echo "download -> .gitignore"; else git rm -q download; fi
          fi
          # archivos de caché de Python que se subieron por error (se regeneran solos)
          git ls-files | grep -E '(^|/)__pycache__/|\.pyc$' | while read -r f; do git rm -q --cached "$f"; rm -f "$f"; echo "borrada: $f"; done
      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git diff --cached --quiet || (git commit -m "Limpiar copias sueltas de la raíz" && git push)
