<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Productos · ComparáTech</title>
<link rel="stylesheet" href="css/layout.css">
<style>
.wrap{max-width:1280px;margin:auto;padding:16px 16px 20px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
aside{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;align-self:start;position:sticky;top:calc(var(--hh) + 14px);max-height:calc(100vh - var(--hh) - 28px);overflow-y:auto;overscroll-behavior:contain}
aside h4{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}aside h4:first-child{margin-top:0}
.fl label{display:flex;gap:7px;align-items:center;padding:2px 0;cursor:pointer}.fl .c{margin-left:auto;color:var(--mut);font-size:12px}
select,input[type=number]{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
.rng{display:flex;gap:6px}.more{background:none;border:0;color:var(--acc);padding:4px 0;font-size:12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.tab{border:1px solid var(--line);background:var(--card);color:var(--tx);padding:7px 13px;border-radius:999px}
.tab.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}.tab .n{opacity:.7;margin-left:4px}
.sortw{margin-left:auto;display:flex;gap:8px;align-items:center}.sortw select{width:auto}
.summary{color:var(--mut);margin:4px 0 10px;font-size:13px}
.alert{background:var(--soft);border:1px solid var(--line);border-left:4px solid var(--up);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;position:relative;display:flex;flex-direction:column}
.card:hover{border-color:var(--acc)}
a.sec,a.pri{display:inline-flex;align-items:center;gap:4px}.stretch{position:absolute;inset:0;z-index:1;border-radius:inherit}.stretch:focus-visible{outline:3px solid var(--acc);outline-offset:2px}.card .star,.card .addl{z-index:2}
.im{aspect-ratio:1;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:8px;position:relative}
.im img{max-width:100%;max-height:100%;object-fit:contain}.im .ph{color:#b8bec9;font-size:12px}
.badge{position:absolute;left:6px;top:6px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.badge.d{background:#cdf5df;color:#0b6b4a}.badge.u{background:#ffd9d4;color:#a3281a}
.star{position:absolute;right:6px;top:6px;background:rgba(255,255,255,.9);border:0;border-radius:50%;width:28px;height:28px;font-size:15px;line-height:28px;color:#555}.star.on{color:#e0a100}
.st{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.nm{font-weight:600;margin:2px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.pr{font-size:18px;font-weight:700;margin-top:auto}.old{font-size:12px;color:var(--mut);text-decoration:line-through;margin-left:6px;font-weight:400}
.sub{font-size:12px;color:var(--mut)}.low{color:var(--down);font-weight:600}
.empty{padding:40px;text-align:center;color:var(--mut)}
.pager{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;margin:22px 0 4px}.pager button{min-width:40px;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:var(--card);color:var(--tx);font-weight:600}.pager button:hover:not(:disabled){background:var(--soft);border-color:var(--acc)}.pager button.on{background:var(--grad);color:#fff;border-color:transparent;cursor:default}.pager button:disabled{opacity:.55;cursor:not-allowed}.pager .gap{padding:0 4px;color:var(--mut)}
.pinfo{text-align:center;color:var(--mut);font-size:12.5px;margin-top:8px}
.ptitle{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin:0 0 10px}.ptitle h1{margin:0;font-size:24px;letter-spacing:-.5px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;padding:20px;overflow:auto;z-index:70;overscroll-behavior:contain}
.modal.on{display:flex}.box{background:var(--card);border:1px solid var(--line2);border-radius:14px;max-width:860px;width:100%;padding:18px;position:relative;margin:auto}
.x{position:absolute;right:12px;top:10px;border:0;background:none;font-size:24px;color:var(--mut)}
.mh{display:flex;gap:16px;align-items:center;margin-bottom:12px}.mh .im{width:120px;flex:none;margin:0}
.big{font-size:26px;font-weight:800}.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--soft);margin-right:6px}
table{width:100%;border-collapse:collapse}th,td{padding:8px;text-align:left;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--mut);font-weight:500}
td.n,th.n{text-align:right;white-space:nowrap}tr.best td{background:var(--best)}.in{color:var(--down)}.out{color:var(--up)}
.up{color:var(--up);font-weight:600}.dn{color:var(--down);font-weight:600}
.chart{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:10px}.chart svg{width:100%;height:auto;display:block}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:6px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
#fbtn{display:none}
.demo{background:#fff3cd;color:#6b4e00;padding:8px 12px;text-align:center;font-size:13px}
@media(max-width:1180px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:800px){.wrap{grid-template-columns:1fr}aside{display:none;position:static;max-height:none}aside.show{display:block}#fbtn{display:inline-block}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.mh{flex-direction:column;align-items:flex-start}}

/* ---- rediseño (actualización 5) ---- */
aside{border-radius:var(--r);box-shadow:var(--sh)}
.fresh{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--mut);white-space:nowrap}.fresh.old{text-decoration:none;margin-left:0}.fresh i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#12a37a}.fresh.mid i{background:#e0a100}.fresh.old i{background:#d64545}
.tab{box-shadow:var(--sh);transition:transform .08s}.tab:active{transform:translateY(1px)}.tab.on{background:var(--grad);border-color:transparent;color:#fff}
.card{border-radius:16px;box-shadow:var(--sh);transition:transform .15s,border-color .15s,box-shadow .15s}.card:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 10px 28px rgba(37,99,235,.18)}
.im{border-radius:12px;background:#fff}.pr{font-size:19px;letter-spacing:-.4px}

.addl{position:absolute;right:6px;bottom:6px;background:rgba(255,255,255,.94);border:0;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;color:#0f172a;box-shadow:0 1px 4px rgba(0,0,0,.2)}.addl.on{background:#0b7a58;color:#fff}
.warnpill{display:inline-block;font-size:12px;padding:1px 7px;border-radius:999px;background:var(--warnbg);color:var(--warn);font-weight:600;margin-left:4px}
.box{border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.rep{display:block;font-size:12px;color:var(--mut);font-weight:400}
.pri{background:var(--grad);color:#fff;border:0;border-radius:999px;padding:9px 16px;font-weight:700}.sec{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-weight:600;color:var(--tx)}
.li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.li .nm{min-height:0;margin:0}
.tot2{margin-top:12px;padding:12px;border-radius:12px;background:var(--soft)}.tot2 b{font-size:18px}
.live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:800px){.li{grid-template-columns:1fr auto}}

/* ---- imágenes, filtros plegables y celular (actualización 6) ---- */
.im .ph{display:flex;flex-direction:column;align-items:center;gap:4px;color:#5b6472;font-size:12px}.im .ph i{font-style:normal;font-size:38px;filter:grayscale(.3);opacity:.75}
aside details{border-top:1px solid var(--line);padding:8px 0}aside details:first-of-type{margin-top:10px}
aside summary{cursor:pointer;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);font-weight:700;list-style:none;display:flex;justify-content:space-between;padding:2px 0}
aside summary::-webkit-details-marker{display:none}aside summary::after{content:"▾";transition:transform .15s}aside details:not([open]) summary::after{transform:rotate(-90deg)}
aside details>*:not(summary){margin-top:6px}
@media(max-width:800px){
  #fbtn{padding:7px 12px}
  .wrap{padding:10px 12px 60px;gap:10px}
  .tab{white-space:nowrap;padding:6px 11px;font-size:13px}
  .sortw{margin-left:0;width:100%}.sortw select{flex:1;width:auto}
  .grid{gap:8px}.card{padding:7px;border-radius:12px}.card:hover{transform:none}
  .im{aspect-ratio:1/.85;margin-bottom:6px}.nm{font-size:13px;min-height:2.6em;margin-bottom:4px}.pr{font-size:16px}.sub,.st{font-size:12px}
  .addl{padding:2px 8px;font-size:12px}
}
[hidden]{display:none!important}
</style>
</head>
<body data-page="productos">
<script src="js/layout.js"></script>
<div id="demo"></div>
<div class="wrap">
  <aside id="side">
    <h4>Categoría</h4><select id="cat"></select>
    <h4>Precio (ARS)</h4><div class="rng"><input id="pmin" type="number" min="0" placeholder="Mín"><input id="pmax" type="number" min="0" placeholder="Máx"></div>
    <details open><summary>Marca</summary><input id="bq" aria-label="Buscar marca" placeholder="Buscar marca…" style="width:100%;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--tx);margin-bottom:4px"><div class="fl" id="brands"></div><button class="more" id="bmore"></button></details>
    <details open><summary>Tienda</summary><div class="fl" id="stores"></div></details>
    <details open><summary>Opciones</summary><div class="fl">
      <label><input type="checkbox" id="stock"> Solo con stock</label>
      <label><input type="checkbox" id="multi"> En 2 o más tiendas</label>
      <label><input type="checkbox" id="lowonly"> En mínimo histórico</label></div></details>
    <h4>&nbsp;</h4><button class="more" id="reset">Limpiar filtros</button>
  </aside>
  <main>
    <div class="ptitle"><h1>Productos</h1><span class="fresh" id="fresh" title="Cuándo se leyeron los precios de las tiendas"></span></div>
    <div id="alert"></div>
    <div class="tabs" id="tabs"></div>
    <div class="summary" id="sum"></div>
    <div class="grid" id="grid" aria-busy="true"><div class="sk" aria-hidden="true"><i></i><b></b><b></b></div><div class="sk" aria-hidden="true"><i></i><b></b><b></b></div><div class="sk" aria-hidden="true"><i></i><b></b><b></b></div><div class="sk" aria-hidden="true"><i></i><b></b><b></b></div><div class="sk" aria-hidden="true"><i></i><b></b><b></b></div><div class="sk" aria-hidden="true"><i></i><b></b><b></b></div><div class="sk" aria-hidden="true"><i></i><b></b><b></b></div><div class="sk" aria-hidden="true"><i></i><b></b><b></b></div></div>
    <nav class="pager" id="pager" aria-label="Páginas de resultados"></nav><div class="pinfo" id="pinfo"></div>
  </main>
</div>
<div class="live" id="live" role="status" aria-live="polite"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Detalle"><div class="box" id="box"></div></div>
<script>
const $=s=>document.querySelector(s),ARS=n=>n==null?"—":"$"+Math.round(n).toLocaleString("es-AR");
const CATS={procesadores:"Procesadores",motherboards:"Motherboards","placas-de-video":"Placas de video","memorias-ram":"Memorias RAM",almacenamiento:"Almacenamiento",refrigeracion:"Refrigeración",fuentes:"Fuentes",gabinetes:"Gabinetes",monitores:"Monitores",notebooks:"Notebooks","pcs-armadas":"PCs armadas",mouses:"Mouse",teclados:"Teclados",auriculares:"Auriculares",perifericos:"Otros periféricos",redes:"Redes",accesorios:"Cables y accesorios",otros:"Otros"};
const ICON={procesadores:"🧠",motherboards:"🔌","placas-de-video":"🎮","memorias-ram":"🧮",almacenamiento:"💽",refrigeracion:"❄️",fuentes:"⚡",gabinetes:"🖥️",monitores:"🖥️",notebooks:"💻","pcs-armadas":"🖥️",mouses:"🖱️",teclados:"⌨️",auriculares:"🎧",perifericos:"🕹️",redes:"📡",accesorios:"🔌",otros:"📦"};
const FB={};   // id -> imagen de respaldo (miniatura) si la de alta resolución falla
function imgFail(el){const id=el.dataset.id,fb=FB[id];
  if(fb&&el.src!==fb){el.src=fb;return}
  const d=DATA.find(x=>x.id===id),sp=document.createElement("span");sp.className="ph";sp.innerHTML=`<i>${ICON[d&&d.category]||"📦"}</i>Sin foto`;el.replaceWith(sp)}
const imgTag=(g,lazy)=>g.image?`<img ${lazy?'loading="lazy" ':""}data-id="${esc(g.id)}" src="${esc(g.image)}" alt="" onerror="imgFail(this)">`:`<span class="ph"><i>${ICON[g.category]||"📦"}</i>Sin foto</span>`;
const COLORS=["#1f6feb","#e0763a","#12a37a","#b04ad6","#d6a31f","#d64a6a","#4a9ed6"];
let DATA=[],HIST={},META={},CFG={stores:{}};
const S={tab:"todos",cat:"",brands:new Set(),stores:new Set(),pmin:null,pmax:null,stock:false,multi:false,lowonly:false,sort:"price",q:"",page:1,allBrands:false,bq:""};
const PER=32;   // 4 columnas × 8 filas por página
const chgOk=g=>!!(g.chg&&!(g.offers[0]&&g.offers[0].anom));   // un salto sospechoso no cuenta como "bajó/subió"
const price=o=>o.price_cash??o.price_list,best=g=>price(g.offers[0]);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let FOLLOW={};try{FOLLOW=JSON.parse(localStorage.getItem("seg")||"{}")}catch{}
let LIST=[];try{LIST=JSON.parse(localStorage.getItem("lista")||"[]")}catch{}
const saveL=()=>{try{localStorage.setItem("lista",JSON.stringify(LIST))}catch{}};
let STORES={stores:{}};
const stale=s=>{const m=(META.stores||{})[s];return !!(m&&!m.ok)};   // la tienda no respondió en la última lectura: se muestran datos anteriores
const rep1=s=>REP.get(s);
const saveF=()=>{try{localStorage.setItem("seg",JSON.stringify(FOLLOW))}catch{}};
function openAlerts(){
  const A=CFG.alerts||{},ok=u=>typeof u==="string"&&/^https:\/\//.test(u);
  $("#box").innerHTML=`<button class="x" id="cx" aria-label="Cerrar">×</button><h2 style="margin:0 0 6px">🔔 Avisos de bajas de precio</h2>
  <p class="sub" style="margin:0 0 12px">Una vez por semana te mandamos las mayores bajas confirmadas (sin saltos raros ni productos sin stock). Podés darte de baja cuando quieras.</p>
  <div style="display:flex;gap:10px;flex-wrap:wrap">${ok(A.email_form_url)?`<a class="pri" href="${esc(A.email_form_url)}" target="_blank" rel="noopener noreferrer">✉️ Recibir por mail</a>`:""}${ok(A.whatsapp_channel_url)?`<a class="sec" href="${esc(A.whatsapp_channel_url)}" target="_blank" rel="noopener noreferrer">💬 Seguir el canal de WhatsApp</a>`:""}</div>
  <p class="sub" style="margin:12px 0 0">Tu mail lo guarda el servicio de envío (Brevo), no este sitio. El canal de WhatsApp es público: nadie ve tu número.</p>`;
  $("#modal").classList.add("on");$("#cx").onclick=()=>$("#modal").classList.remove("on");
}
async function j(u,d){try{const r=await fetch(u,{cache:"no-cache"});if(!r.ok)throw 0;return await r.json()}catch{return d}}

function visible(g){ // oferta(s) que pasan los filtros de tienda/stock
  return g.offers.filter(o=>(!S.stores.size||S.stores.has(o.store))&&(!S.stock||o.stock!==false));
}
function filtered(skip){
  const q=S.q.toLowerCase().split(/\s+/).filter(Boolean);
  return DATA.filter(g=>{
    if(skip!=="cat"&&S.cat&&g.category!==S.cat)return false;
    if(skip!=="brand"&&S.brands.size&&!S.brands.has(g.brand))return false;
    if(q.length){const n=g.name.toLowerCase();if(!q.every(t=>n.includes(t)))return false}
    const v=visible(g);if(!v.length)return false;
    const p=price(v[0]);if(S.pmin!=null&&p<S.pmin)return false;if(S.pmax!=null&&p>S.pmax)return false;
    if(S.multi&&g.offers.length<2)return false;
    if(S.lowonly&&!g.low)return false;
    if(S.tab==="bajaron"&&!(chgOk(g)&&g.chg.pct<0))return false;
    if(S.tab==="subieron"&&!(chgOk(g)&&g.chg.pct>0))return false;
    if(S.tab==="seguidos"&&!FOLLOW[g.id])return false;
    return true;
  });
}
function sorter(){
  const spread=g=>{if(g.dif)return 0;const p=g.offers.map(price);return Math.max(...p)-Math.min(...p)};
  const pct=g=>chgOk(g)?g.chg.pct:0;
  const W={"placas-de-video":40,procesadores:40,motherboards:30,"memorias-ram":30,almacenamiento:25,monitores:25,notebooks:25,fuentes:20,"pcs-armadas":20,gabinetes:15,refrigeracion:15,mouses:12,teclados:12,auriculares:12,perifericos:10,redes:8};
  const rel=g=>(W[g.category]||0)+Math.min(g.offers.length,4)*25+(g.offers.some(o=>o.stock===true)?20:0)+(g.image?10:0)+(chgOk(g)&&g.chg.pct<0?8:0)+(g.offers.some(o=>o.anom)?-30:0);
  return {rel:(a,b)=>rel(b)-rel(a)||best(a)-best(b),price:(a,b)=>best(a)-best(b),priceDesc:(a,b)=>best(b)-best(a),down:(a,b)=>pct(a)-pct(b),up:(a,b)=>pct(b)-pct(a),
    stores:(a,b)=>b.offers.length-a.offers.length||best(a)-best(b),spread:(a,b)=>spread(b)-spread(a)}[S.sort];
}
function card(g){
  const o=visible(g)[0]||g.offers[0],c=chgOk(g)?g.chg:null;
  const badge=c?`<span class="badge ${c.pct<0?"d":"u"}">${c.pct<0?"▼":"▲"} ${Math.abs(c.pct).toLocaleString("es-AR")}%</span>`:"";
  const f=FOLLOW[g.id]?" on":"";
  return `<div class="card" data-id="${esc(g.id)}"><a class="stretch" href="${DET.url(g.id)}" data-open="${esc(g.id)}" aria-label="${esc("Ver "+g.name)}"></a><div class="im">${imgTag(g,true)}${badge}<button class="star${f}" data-f="${esc(g.id)}" title="Seguir este producto" aria-label="Seguir precio">${f?"★":"☆"}</button><button class="addl${LIST.includes(g.id)?" on":""}" data-l="${esc(g.id)}" aria-label="${LIST.includes(g.id)?"Quitar de mi lista":"Agregar a mi lista"}">${LIST.includes(g.id)?"✓ En lista":"+ Lista"}</button></div>
  <div class="st">${esc(o.store)}${REP.badge(o.store)}${stale(o.store)?'<span class="warnpill" title="La tienda no respondió en la última lectura: este precio puede estar desactualizado">dato viejo</span>':""}${o.anom?'<span class="warnpill" title="El precio cambió de forma muy brusca: confirmalo en la tienda">precio inusual</span>':""}${g.dif?'<span class="warnpill" title="Los precios de las tiendas difieren 3 veces o más: confirmá que sea exactamente el mismo modelo">precios muy distintos</span>':""}</div><div class="nm">${esc(g.name)}</div>
  <div class="pr">${ARS(price(o))}${c&&c.pct<0?`<span class="old">${ARS(c.prev)}</span>`:""}</div>
  <div class="sub">${g.offers.length>1?`Comparado en ${g.offers.length} tiendas`:"1 tienda"}${g.low?' · <span class="low">mínimo histórico</span>':""}</div></div>`;
}
function counts(){const t={todos:DATA.length,bajaron:0,subieron:0,seguidos:0};
  DATA.forEach(g=>{if(chgOk(g))g.chg.pct<0?t.bajaron++:t.subieron++;if(FOLLOW[g.id])t.seguidos++});return t}
function renderSide(){
  const base=filtered("cat"),cc={};base.forEach(g=>cc[g.category]=(cc[g.category]||0)+1);
  $("#cat").innerHTML=`<option value="">Todas (${base.length})</option>`+Object.keys(CATS).filter(k=>cc[k]||S.cat===k).map(k=>`<option value="${k}" ${S.cat===k?"selected":""}>${CATS[k]} (${cc[k]||0})</option>`).join("");
  const bb=filtered("brand"),bc={};bb.forEach(g=>{if(g.brand)bc[g.brand]=(bc[g.brand]||0)+1});
  let bl=Object.entries(bc).sort((a,b)=>b[1]-a[1]);if(S.bq)bl=bl.filter(([b])=>b.toLowerCase().includes(S.bq));
  const total=bl.length;if(!S.allBrands&&!S.bq)bl=bl.slice(0,10);
  $("#brands").innerHTML=bl.map(([b,n])=>`<label><input type="checkbox" data-b="${esc(b)}" ${S.brands.has(b)?"checked":""}> ${esc(b)}<span class="c">${n}</span></label>`).join("");
  $("#bmore").textContent=total>10&&!S.bq?(S.allBrands?"Ver menos":`Ver todas (${total})`):"";
}
function render(){
  const t=counts(),names={todos:"Todos",bajaron:"▼ Bajaron de precio",subieron:"▲ Subieron de precio",seguidos:"★ Seguidos"};
  $("#tabs").innerHTML=Object.keys(names).map(k=>`<button class="tab ${S.tab===k?"on":""}" data-t="${k}">${names[k]}<span class="n">${t[k]}</span></button>`).join("")+`<button class="tab" id="fbtn" aria-expanded="${$("#side").classList.contains("show")}">☰ Filtros</button>`+
   `<div class="sortw"><span class="sub">Ordenar</span><select id="sort">${[["price","Menor precio"],["rel","Más relevante"],["priceDesc","Mayor precio"],["down","Mayor baja %"],["up","Mayor suba %"],["stores","Más tiendas"],["spread","Mayor diferencia entre tiendas"]].map(([v,l])=>`<option value="${v}" ${S.sort===v?"selected":""}>${l}</option>`).join("")}</select></div>`;
  $("#sort").onchange=e=>{S.sort=e.target.value;S.page=1;render()};
  const rows=filtered().sort(sorter());
  $("#sum").textContent=`${rows.length.toLocaleString("es-AR")} resultados`+(S.tab==="bajaron"||S.tab==="subieron"?` · cambios de los últimos ${META.recent_days||14} días`:"");
  const pages=Math.max(1,Math.ceil(rows.length/PER));if(S.page>pages)S.page=pages;if(S.page<1)S.page=1;
  const from=(S.page-1)*PER;
  $("#grid").removeAttribute("aria-busy");
  $("#grid").innerHTML=rows.slice(from,from+PER).map(card).join("")||`<div class="empty">${S.tab==="seguidos"?"Todavía no seguís productos. Tocá la ☆ de cualquier producto.":S.tab==="todos"?"Sin resultados.":"Todavía no hay cambios de precio registrados. Aparecen a medida que se actualizan los datos."}</div>`;
  renderPager(pages,rows.length,from);syncUrl();
  renderSide();
}
function renderPager(pages,total,from){
  const pg=$("#pager"),info=$("#pinfo");
  if(pages<=1){pg.innerHTML="";info.textContent=total?`Mostrando los ${total} resultados`:"";return}
  const b=(n,l,dis,on)=>`<button data-pg="${n}" ${dis?"disabled":""} ${on?'class="on" aria-current="page"':""} aria-label="${on?"Página "+n+" (actual)":/^\d+$/.test(l)?"Ir a la página "+l:l}">${l}</button>`;
  pg.innerHTML=b(S.page-1,"‹ Anterior",S.page<=1)+CT.pageList(S.page,pages).map(n=>n==="…"?'<span class="gap">…</span>':b(n,String(n),false,n===S.page)).join("")+b(S.page+1,"Siguiente ›",S.page>=pages);
  info.textContent=`Página ${S.page} de ${pages} · productos ${from+1}–${Math.min(from+PER,total)} de ${total.toLocaleString("es-AR")}`;
}
function syncUrl(){   // la página, la búsqueda y la categoría quedan en la dirección: se puede volver atrás o compartir
  try{const u=new URLSearchParams();if(S.q)u.set("q",S.q);if(S.cat)u.set("cat",S.cat);if(S.tab!=="todos")u.set("tab",S.tab);if(S.page>1)u.set("p",S.page);
    history.replaceState(null,"",location.pathname+(u.toString()?"?"+u:""))}catch{}
}
function goPage(n){S.page=n;render();const t=$(".ptitle");if(t)window.scrollTo({top:t.getBoundingClientRect().top+scrollY-(document.querySelector("header.site")?document.querySelector("header.site").offsetHeight:0)-10,behavior:"auto"})}
function alertBox(){
  const ch=Object.entries(FOLLOW).map(([id,f])=>{const g=DATA.find(x=>x.id===id);return g&&{g,f,d:best(g)-f.price}}).filter(x=>x&&Math.abs(x.d)>0);
  const up=ch.filter(x=>x.d>0),dn=ch.filter(x=>x.d<0),ds=DATA.filter(g=>chgOk(g)&&g.chg.pct>0).length;
  let h="";
  if(ch.length)h+=`<div class="alert"><b>Tus productos seguidos:</b> ${up.length?`<span class="up">${up.length} subieron</span>`:""} ${dn.length?`<span class="dn">${dn.length} bajaron</span>`:""} desde que los seguiste. <a href="#" data-t="seguidos">Verlos</a></div>`;
  $("#alert").innerHTML=h;
}
const CTX=()=>({HIST,META,CFG,REP,stale});
const chart=g=>DET.chart(g,CTX());
function openModal(id){
  const g=DATA.find(x=>x.id===id);if(!g)return;
  const rows=DET.offerRows(g,CTX());
  const c=g.chg,f=!!FOLLOW[g.id];
  $("#box").innerHTML=`<button class="x" id="cx">×</button><div class="mh"><div class="im">${imgTag(g,false)}</div><div><span class="tag">${esc(CATS[g.category]||g.category)}</span>${g.img_src?`<span class="tag" title="Ninguna tienda publica foto de este producto">Foto: ${esc(g.img_src)}</span>`:""}${g.brand?`<span class="tag">${esc(g.brand)}</span>`:""}<h2 style="margin:6px 0">${esc(g.name)}</h2>
  <div class="big">${ARS(best(g))} <span class="sub">en ${esc(g.offers[0].store)}</span></div>
  ${c?`<div class="${c.pct<0?"dn":"up"}">${c.pct<0?"▼ Bajó":"▲ Subió"} ${Math.abs(c.pct)}% (antes ${ARS(c.prev)})</div>`:""}
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="tab ${f?"on":""}" id="fb">${f?"★ Siguiendo":"☆ Seguir precio"}</button><button class="pri" id="fl">${LIST.includes(g.id)?"✓ En mi lista (quitar)":"+ Agregar a mi lista"}</button><a class="sec" href="${DET.url(g.id)}" target="_blank" rel="noopener">↗ Abrir en otra pestaña</a></div></div></div>
  <table><tr><th>Tienda</th><th class="n">Efectivo / transf.</th><th class="n">Lista / tarjeta</th><th>Cuotas</th><th>Stock</th><th></th></tr>${rows}</table><p class="sub" style="margin:8px 0 0">${(()=>{const rs=g.offers.map(o=>o.store).filter(x=>rep1(x));return rs.length?"La reputación es el puntaje público de cada tienda en una sola plataforma (fecha en el detalle al pasar el mouse); no se promedian fuentes. ":""})()}Los precios no incluyen envío: se calcula en cada tienda.</p>${g.offers.some(o=>o.anom)?'<div class="alert" style="margin-top:10px;border-left-color:var(--warn)">Alguna oferta cambió de precio de forma muy brusca. Puede ser un error de la tienda: confirmalo antes de comprar.</div>':""}${chart(g)}`;
  $("#modal").classList.add("on");
  $("#cx").onclick=()=>$("#modal").classList.remove("on");
  $("#fb").onclick=()=>{toggleF(g.id);openModal(id)};
  $("#fl").onclick=()=>{toggleL(g.id);openModal(id)};
}
function toggleL(id){const i=LIST.indexOf(id);i>=0?LIST.splice(i,1):LIST.push(id);saveL();CTL.count(LIST.length);$("#live").textContent=i>=0?"Quitado de tu lista":"Agregado a tu lista";render()}
function openList(){
  const gs=LIST.map(id=>DATA.find(g=>g.id===id)).filter(Boolean);
  const rows=gs.map(g=>{const o=g.offers.filter(x=>x.stock!==false)[0];return {g,o}});
  const sum=rows.filter(r=>r.o).reduce((a,r)=>a+price(r.o),0);
  const common=[...new Set(gs.flatMap(g=>g.offers.map(o=>o.store)))].filter(st=>gs.every(g=>g.offers.some(o=>o.store===st&&o.stock!==false)));
  const per=common.map(st=>({st,t:gs.reduce((a,g)=>a+price(g.offers.find(o=>o.store===st)),0)})).sort((a,b)=>a.t-b.t);
  const nst=new Set(rows.filter(r=>r.o).map(r=>r.o.store)).size;
  $("#box").innerHTML=`<button class="x" id="cx" aria-label="Cerrar">×</button><h2 style="margin:0 0 4px">Mi lista de compra</h2><p class="sub" style="margin:0 0 8px">Se guarda solo en este navegador. Precios con stock confirmado o a confirmar; sin envío.</p>`+
   (gs.length?rows.map(({g,o})=>`<div class="li"><div><div class="nm">${esc(g.name)}</div><div class="sub">${o?`${esc(o.store)}${REP.badge(o.store)}${o.stock===true?"":" · stock a confirmar"}`:"Sin stock en este momento"}</div></div><b>${o?ARS(price(o)):"—"}</b><button class="sec" data-lr="${esc(g.id)}" aria-label="Quitar de la lista">Quitar</button></div>`).join("")+
   `<div class="tot2"><div>Comprando lo más barato de cada producto: <b>${ARS(sum)}</b> <span class="sub">(${nst} ${nst===1?"tienda":"tiendas"}${rows.some(r=>!r.o)?"; faltan productos sin stock":""})</span></div>
   <div style="margin-top:6px">${per.length?`En una sola tienda: <b>${ARS(per[0].t)}</b> en ${esc(per[0].st)}${per.length>1?` <span class="sub">(luego ${esc(per[1].st)}: ${ARS(per[1].t)})</span>`:""}`:`<span class="sub">Ninguna tienda tiene todos los productos con stock.</span>`}</div></div>
   <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="pri" id="lcopy">Copiar lista</button><button class="sec" id="lclear">Vaciar</button></div>`:`<div class="empty">Tu lista está vacía. Tocá «+ Lista» en cualquier producto.</div>`);
  $("#modal").classList.add("on");$("#cx").onclick=()=>$("#modal").classList.remove("on");
  document.querySelectorAll("[data-lr]").forEach(b=>b.onclick=()=>{toggleL(b.dataset.lr);openList()});
  const cl=$("#lclear");if(cl)cl.onclick=()=>{LIST=[];saveL();CTL.count(0);render();openList()};
  const cp=$("#lcopy");if(cp)cp.onclick=async()=>{const t=rows.map(({g,o})=>`- ${g.name}: ${o?ARS(price(o))+" ("+o.store+")":"sin stock"}`).join("\n")+`\nTotal: ${ARS(sum)} (sin envío) · ${new Date().toLocaleDateString("es-AR")}`;try{await navigator.clipboard.writeText(t);cp.textContent="¡Copiada!"}catch{cp.textContent="No se pudo copiar"}};
}
function toggleF(id){const g=DATA.find(x=>x.id===id);if(FOLLOW[id])delete FOLLOW[id];else FOLLOW[id]={price:best(g),name:g.name};saveF();alertBox();render()}
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.dataset.f){e.stopPropagation();toggleF(t.dataset.f);return}
  if(t.dataset.l){e.stopPropagation();toggleL(t.dataset.l);return}
  const tb=t.closest("[data-t]");if(tb){e.preventDefault();S.tab=tb.dataset.t;S.page=1;if(S.tab==="bajaron")S.sort="down";else if(S.tab==="subieron")S.sort="up";else if(S.tab==="todos"&&(S.sort==="down"||S.sort==="up"))S.sort="price";render();return}
  if(t.closest("#fbtn")){$("#side").classList.toggle("show");render();return}
  const pb=t.closest("[data-pg]");if(pb&&!pb.disabled){goPage(+pb.dataset.pg);return}
  const op=t.closest("a.stretch");if(op){if(e.ctrlKey||e.metaKey||e.shiftKey||e.altKey)return;e.preventDefault();openModal(op.dataset.open);return}
  const c=t.closest(".card");if(c){openModal(c.dataset.id);return}
  if(t.id==="modal")t.classList.remove("on");
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#modal").classList.remove("on")});
function bind(){
  const re=()=>{S.page=1;render()};
  $("#qh").oninput=e=>{S.q=e.target.value;re()};
  $("#cat").onchange=e=>{S.cat=e.target.value;re()};
  const num=v=>v===""?null:Number(v);
  $("#pmin").oninput=e=>{S.pmin=num(e.target.value);re()};$("#pmax").oninput=e=>{S.pmax=num(e.target.value);re()};
  ["stock","multi","lowonly"].forEach(k=>$("#"+k).onchange=e=>{S[k]=e.target.checked;re()});
  $("#brands").onchange=e=>{const b=e.target.dataset.b;e.target.checked?S.brands.add(b):S.brands.delete(b);re()};
  $("#stores").onchange=e=>{const b=e.target.dataset.s;e.target.checked?S.stores.add(b):S.stores.delete(b);re()};
  $("#bq").oninput=e=>{S.bq=e.target.value.toLowerCase();renderSide()};
  $("#bmore").onclick=()=>{S.allBrands=!S.allBrands;renderSide()};
  $("#lbtn").onclick=openList;
  {const A=CFG.alerts||{},ok=u=>typeof u==="string"&&/^https:\/\//.test(u);if(ok(A.email_form_url)||ok(A.whatsapp_channel_url)){$("#abtn").hidden=false;$("#abtn").onclick=openAlerts}}
  $("#reset").onclick=()=>{Object.assign(S,{cat:"",brands:new Set(),stores:new Set(),pmin:null,pmax:null,stock:false,multi:false,lowonly:false,q:"",bq:""});
    ["qh","pmin","pmax","bq"].forEach(i=>$("#"+i).value="");["stock","multi","lowonly"].forEach(i=>$("#"+i).checked=false);re()};
}
(async()=>{
  [DATA,HIST,META,CFG,STORES]=await Promise.all([j("data/products.json",[]),j("data/history.json",{}),j("data/meta.json",{}),j("data/config.json",{stores:{}}),j("data/stores.json",{stores:{}})]);REP.set(STORES);
  DATA.forEach(g=>{if(g.image_fb)FB[g.id]=g.image_fb});
  CTL.count(LIST.length);
  {const h=META.updated?(Date.now()-new Date(META.updated).getTime())/36e5:null,el=$("#fresh");
   el.className="fresh"+(h==null?" old":h>24?" old":h>12?" mid":"");
   el.innerHTML=h==null?"<i></i>Sin fecha de actualización":`<i></i>Actualizado ${h<1?"hace menos de 1 h":h<48?"hace "+Math.round(h)+" h":"hace "+Math.round(h/24)+" días"}`;}
  const sc={};DATA.forEach(g=>g.offers.forEach(o=>sc[o.store]=(sc[o.store]||0)+1));
  $("#stores").innerHTML=Object.keys(META.stores||sc).map(s=>{const m=(META.stores||{})[s];return `<label title="${esc(m&&m.error||"")}"><input type="checkbox" data-s="${esc(s)}"> ${esc(s)}${m&&!m.ok?" ⚠️":""}<span class="c">${sc[s]||0}</span></label>`}).join("");
  if(META.demo)$("#demo").innerHTML='<div class="demo">Datos de ejemplo (inventados) para probar el diseño.</div>';
  {const u=new URLSearchParams(location.search);
   if(u.get("q")){S.q=u.get("q").slice(0,120);$("#qh").value=S.q}
   if(u.get("cat")&&CATS[u.get("cat")])S.cat=u.get("cat");
   if(["bajaron","subieron","seguidos"].includes(u.get("tab"))){S.tab=u.get("tab");if(S.tab==="bajaron")S.sort="down";if(S.tab==="subieron")S.sort="up"}
   const p=parseInt(u.get("p"),10);if(p>0)S.page=p;
   bind();alertBox();render();
   if(u.get("lista"))openList();else if(u.get("avisos")&&!$("#abtn").hidden)openAlerts();}
})();
</script>
<script src="js/lib.js"></script><script src="js/rep.js"></script><script src="js/detail.js"></script><script src="js/assistant.js"></script>
<script>CT.CTAssistant.mount({section:"precios",context:()=>({query:S.q,cat:S.cat,ids:filtered().slice(0,3).map(g=>g.id)})});</script>
</body>
