<script>
const $=s=>document.querySelector(s),ARS=n=>n==null?"—":"$"+Math.round(n).toLocaleString("es-AR");
const CATS={procesadores:"Procesadores",motherboards:"Motherboards","placas-de-video":"Placas de video","memorias-ram":"Memorias RAM",almacenamiento:"Almacenamiento",refrigeracion:"Refrigeración",fuentes:"Fuentes",gabinetes:"Gabinetes",monitores:"Monitores",notebooks:"Notebooks","pcs-armadas":"PCs armadas",mouses:"Mouse",teclados:"Teclados",auriculares:"Auriculares",perifericos:"Otros periféricos",redes:"Redes",accesorios:"Cables y accesorios",otros:"Otros"};
const FB={};   // id -> imagen de respaldo (miniatura) si la de alta resolución falla
function imgFail(el){const id=el.dataset.id,fb=FB[id];
  if(fb&&el.src!==fb){el.src=fb;return}
  const d=DATA.find(x=>x.id===id),sp=document.createElement("span");sp.className="ph";sp.innerHTML=`${ICONS.svg((d&&d.category)||"otros",38)}Sin foto`;el.replaceWith(sp)}
const imgTag=(g,lazy)=>g.image?`<img ${lazy?'loading="lazy" ':""}data-id="${esc(g.id)}" src="${esc(g.image)}" alt="" onerror="imgFail(this)">`:`<span class="ph">${ICONS.svg(g.category||"otros",38)}Sin foto</span>`;
const COLORS=["#1f6feb","#e0763a","#12a37a","#b04ad6","#d6a31f","#d64a6a","#4a9ed6"];
let DATA=[],HIST={},META={},CFG={stores:{}};
const S={tab:"todos",cat:"",brands:new Set(),stores:new Set(),pmin:null,pmax:null,stock:false,multi:false,lowonly:false,sort:"rel",q:"",page:1,allBrands:false,bq:"",fx:{}};
let CX=null;   // contexto con la base de hardware y las fichas (para los filtros por categoría)
const PER=32;   // 4 columnas × 8 filas por página
const chgOk=g=>!!(g.chg&&!(g.offers[0]&&g.offers[0].anom));   // un salto sospechoso no cuenta como "bajó/subió"
const price=o=>o.price_cash??o.price_list,best=g=>price(g.offers[0]);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let FOLLOW={};try{FOLLOW=JSON.parse(localStorage.getItem("seg")||"{}")}catch{}
let LIST=[];try{LIST=JSON.parse(localStorage.getItem("lista")||"[]")}catch{}
const saveL=()=>{try{localStorage.setItem("lista",JSON.stringify(LIST))}catch{}};
let STORES={stores:{}};
const stale=s=>{const m=(META.stores||{})[s];return !!(m&&!m.ok)};   // la tienda no respondió en la última lectura: se muestran datos anteriores
const rep1=s=>REP.get(s);
const saveF=()=>{try{localStorage.setItem("seg",JSON.stringify(FOLLOW))}catch{}};
addEventListener("acc:synced",e=>{if(!e.detail||!e.detail.changed||!DATA.length)return;try{FOLLOW=JSON.parse(localStorage.getItem("seg")||"{}")}catch{}alertBox();render()});
function openAlerts(){
  const A=CFG.alerts||{},ok=u=>typeof u==="string"&&/^https:\/\//.test(u);
  $("#box").innerHTML=`<button class="x" id="cx" aria-label="Cerrar">×</button><h2 style="margin:0 0 6px">🔔 Avisos de bajas de precio</h2>
  <p class="sub" style="margin:0 0 12px">Una vez por semana te mandamos las mayores bajas confirmadas (sin saltos raros ni productos sin stock). Podés darte de baja cuando quieras.</p>
  <div style="display:flex;gap:10px;flex-wrap:wrap">${ok(A.email_form_url)?`<a class="pri" href="${esc(A.email_form_url)}" target="_blank" rel="noopener noreferrer">✉️ Recibir por mail</a>`:""}${ok(A.whatsapp_channel_url)?`<a class="sec" href="${esc(A.whatsapp_channel_url)}" target="_blank" rel="noopener noreferrer">💬 Seguir el canal de WhatsApp</a>`:""}</div>
  <p class="sub" style="margin:12px 0 0">Tu mail lo guarda el servicio de envío (Brevo), no este sitio. El canal de WhatsApp es público: nadie ve tu número.</p>`;
  $("#modal").classList.add("on");$("#cx").onclick=()=>$("#modal").classList.remove("on");
}
async function j(u,d){try{const r=await fetch(u,{cache:"no-cache"});if(!r.ok)throw 0;return await r.json()}catch{return d}}

function visible(g){ // oferta(s) que pasan los filtros de tienda/stock
  return g.offers.filter(o=>(!S.stores.size||S.stores.has(o.store))&&(!S.stock||o.stock!==false));
}
/* actualización 40: si la búsqueda no coincide exactamente con ningún producto, se muestran los parecidos (errores de
   tipeo, «rtx4060ti» pegado…) con uFuzzy (js/fuzzy.js). Con alguna coincidencia exacta todo sigue igual que antes. */
let QF=null,QK="",FZL=null;
function fuzzyQ(){
  const q=S.q.trim(),k=q+"\u0001"+DATA.length;if(k===QK)return;QK=k;QF=null;
  if(!q)return;const ts=q.toLowerCase().split(/\s+/).filter(Boolean);

function filtered(skip){

    if(skip!=="brand"&&S.brands.size&&!S.brands.has(g.brand))return false;
    if(S.cat&&window.FX){for(const d of FX.defs(S.cat)){const set=S.fx[d.k];if(!set||!set.size||skip==="fx:"+d.k)continue;if(!set.has(FX.val(g,d)??FX.NONE))return false}}
    if(q.length){if(QF){if(!QF.has(g.id))return false}else{const n=g.name.toLowerCase();if(!q.every(t=>n.includes(t)))return false}}
    const v=visible(g);if(!v.length)return false;
    const p=price(v[0]);if(S.pmin!=null&&p<S.pmin)return false;if(S.pmax!=null&&p>S.pmax)return false;

  if(t.dataset.l){e.stopPropagation();toggleL(t.dataset.l);return}
  if(t.dataset.cmp){e.stopPropagation();e.preventDefault();toggleC(t.dataset.cmp,false);return}
  const tb=t.closest("[data-t]");if(tb){e.preventDefault();S.tab=tb.dataset.t;if(!FULL&&S.tab==="seguidos")loadFull();S.page=1;if(S.tab==="bajaron")S.sort="down";else if(S.tab==="subieron")S.sort="up";else if(S.tab==="todos"&&(S.sort==="down"||S.sort==="up"))S.sort="rel";render();return}
  if(t.closest("#fbtn")){$("#side").classList.toggle("show");render();return}
  const ch=t.closest("[data-chip]");if(ch){const set=S.fx[ch.dataset.chip];if(set)set.delete(ch.dataset.v);S.page=1;render();return}
  const pb=t.closest("[data-pg]");if(pb&&!pb.disabled){goPage(+pb.dataset.pg);return}
  const op=t.closest("a.stretch");if(op){if(e.ctrlKey||e.metaKey||e.shiftKey||e.altKey)return;e.preventDefault();openModal(op.dataset.open);return}
  const c=t.closest(".card");if(c){openModal(c.dataset.id);return}
  if(t.id==="modal")t.classList.remove("on");
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#modal").classList.remove("on")});
function bind(){
  const re=()=>{S.page=1;render()};
  $("#qh").oninput=e=>{S.q=e.target.value;if(!FULL)loadFull();re()};
  $("#catbox").onclick=e=>{const c=e.target.closest("#catchg");if(c){S.catOpen=true;if(!FULL){$("#catbox").setAttribute("aria-busy","true");loadFull().then(()=>{$("#catbox").removeAttribute("aria-busy");renderSide()})}else renderSide();return}
    const b=e.target.closest("[data-cat]");if(!b)return;const v=b.dataset.cat;if(v!==S.cat){S.cat=v;S.fx={};S.brands=new Set();S.allBrands=false;S.bq="";$("#bq").value=""}S.catOpen=false;re()};
  $("#fxbox").onchange=e=>{const k=e.target.dataset.fx;if(!k)return;const set=S.fx[k]||(S.fx[k]=new Set());e.target.checked?set.add(e.target.value):set.delete(e.target.value);re()};
  const num=v=>v===""?null:Number(v);
  $("#pmin").oninput=e=>{S.pmin=num(e.target.value);re()};$("#pmax").oninput=e=>{S.pmax=num(e.target.value);re()};
  ["stock","multi","lowonly"].forEach(k=>$("#"+k).onchange=e=>{S[k]=e.target.checked;re()});
  $("#brands").onchange=e=>{const b=e.target.dataset.b;e.target.checked?S.brands.add(b):S.brands.delete(b);re()};
  $("#stores").onchange=e=>{const b=e.target.dataset.s;e.target.checked?S.stores.add(b):S.stores.delete(b);re()};
  $("#bq").oninput=e=>{S.bq=e.target.value.toLowerCase();renderSide()};
  $("#bmore").onclick=()=>{S.allBrands=!S.allBrands;renderSide()};
  $("#lbtn").onclick=()=>FULL?openList():loadFull().then(openList);
  {const A=CFG.alerts||{},ok=u=>typeof u==="string"&&/^https:\/\//.test(u);if(ok(A.email_form_url)||ok(A.whatsapp_channel_url)){$("#abtn").hidden=false;$("#abtn").onclick=openAlerts}}
  $("#reset").onclick=()=>{Object.assign(S,{cat:"",brands:new Set(),stores:new Set(),pmin:null,pmax:null,stock:false,multi:false,lowonly:false,q:"",bq:"",fx:{}});
    ["qh","pmin","pmax","bq"].forEach(i=>$("#"+i).value="");["stock","multi","lowonly"].forEach(i=>$("#"+i).checked=false);re()};
}
/* actualización 39: carga en dos etapas. Con una categoría en la dirección (productos.html?cat=…) primero se baja solo
   esa categoría (data/cat/<cat>.json, unos cientos de KB) y se muestra; el catálogo completo llega después, en segundo
   plano, y la página lo incorpora sola. Sin categoría (todas, búsqueda, mi lista) se espera el catálogo completo, como antes. */
let FULL=false,FULLP=null,HWP=null,TOT=null;
function loadFull(){return FULLP||(FULLP=Promise.all([j("data/products.json",[]),j("data/history.json",{})]).then(([d,h])=>{
  if(Array.isArray(d)&&d.length){DATA=d;HIST=h||{};FULL=true;setupData();if(BOUND)render()}}))}
let BOUND=false;
function setupData(){
  DATA.forEach(g=>{if(g.image_fb)FB[g.id]=g.image_fb});
  let sc={};DATA.forEach(g=>g.offers.forEach(o=>sc[o.store]=(sc[o.store]||0)+1));if(!FULL&&TOT&&TOT.sc)sc=TOT.sc;   // act. 40: totales de todo el catálogo
  // tiendas visibles en el menú: con productos y leídas bien en la última actualización. Las demás (bloqueadas, sin
  // productos u ocultadas en config.json) quedan ocultas, no borradas: vuelven solas cuando se lean bien.
  const showStore=s=>{const m=(META.stores||{})[s];return (sc[s]||0)>0&&!(m&&(m.hidden||!m.ok))&&!((CFG.stores||{})[s]||{}).ocultar};
  $("#stores").innerHTML=Object.keys(META.stores||sc).filter(showStore).map(s=>{const m=(META.stores||{})[s];return `<label title="${esc(m&&m.error||"")}"><input type="checkbox" data-s="${esc(s)}"${S.stores.has(s)?" checked":""}> ${esc(s)}${m&&!m.ok?" ⚠️":""}<span class="c">${sc[s]||0}</span></label>`}).join("");
  // base de hardware y fichas: completan los filtros por categoría (si no cargan, los filtros usan solo el título)
  HWP=HWP||Promise.all([j("data/hardware.json",null),j("data/specs.json",null)]);
  const mine=DATA;HWP.then(([hw,sp])=>{try{if(hw&&window.FX&&mine===DATA){CX=CT.create(hw,DATA,META,sp);FX.init(CX);FX.clear(DATA);if(S.cat&&BOUND)render()}}catch(e){}});
}
(async()=>{
  const u0=new URLSearchParams(location.search),cat0=u0.get("cat")&&CATS[u0.get("cat")]?u0.get("cat"):"";
  const fast=cat0&&!u0.get("q")&&!u0.get("lista")&&u0.get("tab")!=="seguidos";
  const part=fast?j(`data/cat/${cat0}.json`,null):null;
  [META,CFG,STORES]=await Promise.all([j("data/meta.json",{}),j("data/config.json",{stores:{}}),j("data/stores.json",{stores:{}})]);REP.set(STORES);
  const p=part&&await part;
  if(p&&Array.isArray(p.g)&&p.g.length){DATA=p.g;HIST=p.h||{};TOT=p.t&&typeof p.t.todos==="number"?p.t:null;setupData()}else await loadFull();
  CTL.count(LIST.length);
  {const h=META.updated?(Date.now()-new Date(META.updated).getTime())/36e5:null,el=$("#fresh");
   el.className="fresh"+(h==null?" old":h>24?" old":h>12?" mid":"");
   el.innerHTML=h==null?"<i></i>Sin fecha de actualización":`<i></i>Actualizado ${h<1?"hace menos de 1 h":h<48?"hace "+Math.round(h)+" h":"hace "+Math.round(h/24)+" días"}`;}
  if(META.demo)$("#demo").innerHTML='<div class="demo">Datos de ejemplo (inventados) para probar el diseño.</div>';
  {const u=new URLSearchParams(location.search);
   if(u.get("q")){S.q=u.get("q").slice(0,120);$("#qh").value=S.q}
   if(u.get("cat")&&CATS[u.get("cat")])S.cat=u.get("cat");
   if(S.cat)for(const [k,v] of u)if(k.startsWith("f_")&&v)S.fx[k.slice(2)]=new Set(v.split("~").slice(0,20));
   if(["bajaron","subieron","seguidos"].includes(u.get("tab"))){S.tab=u.get("tab");if(S.tab==="bajaron")S.sort="down";if(S.tab==="subieron")S.sort="up"}
   const p=parseInt(u.get("p"),10);if(p>0)S.page=p;
   bind();BOUND=true;alertBox();render();
   if(u.get("lista"))openList();else if(u.get("avisos")&&!$("#abtn").hidden)openAlerts();}
  /* act. 40: el catálogo entero (~20 MB sin comprimir) trababa el celular varios segundos aunque nadie lo usara. Con los
     totales precalculados ya no hace falta: se baja recién al buscar, cambiar de categoría o abrir la lista. Solo se baja
     solo si la persona sigue productos (para avisarle cuáles bajaron en todo el catálogo) o si faltan los totales. */
  if(!FULL&&(!TOT||Object.keys(FOLLOW).length))(window.requestIdleCallback||(f=>setTimeout(f,400)))(()=>loadFull(),{timeout:3000});
})();
