<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ComparáTech · Comparador de precios de hardware</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#0f172a;--mut:#64748b;--line:#e2e8f0;--acc:#2563eb;--grad:linear-gradient(135deg,#2563eb 0%,#7c3aed 100%);--sh:0 1px 2px rgba(15,23,42,.05),0 6px 18px rgba(15,23,42,.05);--r:14px;--warn:#b7791f;--warnbg:#fff4d6;--up:#c4301f;--down:#12805c;--soft:#eef0f3;--best:#e7f6ef}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#131a2b;--tx:#e6eaf5;--mut:#9aa6bd;--line:#232c42;--acc:#7aa2ff;--grad:linear-gradient(135deg,#4f7dff 0%,#9b6dff 100%);--sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);--warn:#e6b450;--warnbg:#332a12;--up:#ff8a80;--down:#4cc29a;--soft:#1e252e;--best:#12302a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
a{color:var(--acc);text-decoration:none}button{font:inherit;cursor:pointer}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{max-width:1280px;margin:auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{font-weight:800;font-size:19px;letter-spacing:-.3px}.logo span{color:var(--acc)}
#q{flex:1;min-width:180px;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--soft);color:var(--tx);font:inherit}
.wrap{max-width:1280px;margin:auto;padding:14px 16px 60px;display:grid;grid-template-columns:250px 1fr;gap:18px}
aside{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;align-self:start}
aside h4{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}aside h4:first-child{margin-top:0}
.fl label{display:flex;gap:7px;align-items:center;padding:2px 0;cursor:pointer}.fl .c{margin-left:auto;color:var(--mut);font-size:12px}
select,input[type=number]{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
.rng{display:flex;gap:6px}.more{background:none;border:0;color:var(--acc);padding:4px 0;font-size:12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.tab{border:1px solid var(--line);background:var(--card);color:var(--tx);padding:7px 13px;border-radius:999px}
.tab.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}.tab .n{opacity:.7;margin-left:4px}
.sortw{margin-left:auto;display:flex;gap:8px;align-items:center}.sortw select{width:auto}
.summary{color:var(--mut);margin:4px 0 10px;font-size:13px}
.alert{background:var(--soft);border:1px solid var(--line);border-left:4px solid var(--up);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;position:relative;display:flex;flex-direction:column}
.card:hover{border-color:var(--acc)}
.im{aspect-ratio:1;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:8px;position:relative}
.im img{max-width:100%;max-height:100%;object-fit:contain}.im .ph{color:#b8bec9;font-size:12px}
.badge{position:absolute;left:6px;top:6px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.badge.d{background:#cdf5df;color:#0b6b4a}.badge.u{background:#ffd9d4;color:#a3281a}
.star{position:absolute;right:6px;top:6px;background:rgba(255,255,255,.9);border:0;border-radius:50%;width:28px;height:28px;font-size:15px;line-height:28px;color:#555}.star.on{color:#e0a100}
.st{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.nm{font-weight:600;margin:2px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.pr{font-size:18px;font-weight:700;margin-top:auto}.old{font-size:12px;color:var(--mut);text-decoration:line-through;margin-left:6px;font-weight:400}
.sub{font-size:12px;color:var(--mut)}.low{color:var(--down);font-weight:600}
.empty{padding:40px;text-align:center;color:var(--mut)}
#more{display:block;margin:16px auto;padding:10px 22px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--tx)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:50}
.modal.on{display:flex}.box{background:var(--card);border-radius:14px;max-width:860px;width:100%;padding:18px;position:relative}
.x{position:absolute;right:12px;top:10px;border:0;background:none;font-size:24px;color:var(--mut)}
.mh{display:flex;gap:16px;align-items:center;margin-bottom:12px}.mh .im{width:120px;flex:none;margin:0}
.big{font-size:26px;font-weight:800}.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--soft);margin-right:6px}
table{width:100%;border-collapse:collapse}th,td{padding:8px;text-align:left;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--mut);font-weight:500}
td.n,th.n{text-align:right;white-space:nowrap}tr.best td{background:var(--best)}.in{color:var(--down)}.out{color:var(--up)}
.up{color:var(--up);font-weight:600}.dn{color:var(--down);font-weight:600}
.chart{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:10px}.chart svg{width:100%;height:auto;display:block}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:6px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
#fbtn{display:none}
footer{max-width:1280px;margin:auto;padding:0 16px 40px;color:var(--mut);font-size:12px}
.demo{background:#fff3cd;color:#6b4e00;padding:8px 12px;text-align:center;font-size:13px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}aside{display:none}aside.show{display:block}#fbtn{display:inline-block}.grid{grid-template-columns:repeat(2,1fr)}.mh{flex-direction:column;align-items:flex-start}}

/* ---- rediseño (actualización 5) ---- */
body{background:radial-gradient(1200px 420px at 50% -140px,color-mix(in srgb,var(--acc) 14%,transparent),transparent),var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased}
header{background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(1.6) blur(10px);z-index:30}
.logo{font-size:20px}.logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;gap:2px;flex-wrap:wrap}.nav a{color:var(--mut);padding:7px 12px;border-radius:999px;font-weight:600;transition:background .15s,color .15s}.nav a:hover{background:var(--soft);color:var(--tx)}.nav a.on{background:var(--tx);color:var(--bg)}
#q{background:var(--card);box-shadow:var(--sh);padding:11px 16px}#q:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 35%,transparent)}
aside{border-radius:var(--r);box-shadow:var(--sh)}
.hero{background:var(--grad);color:#fff;border-radius:18px;padding:22px 24px;margin-bottom:14px;box-shadow:var(--sh);display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hero h1{margin:0 0 4px;font-size:26px;letter-spacing:-.6px}.hero p{margin:0;opacity:.92;max-width:52ch}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:rgba(255,255,255,.16);border-radius:12px;padding:8px 14px;min-width:96px}.stat b{display:block;font-size:20px}.stat span{font-size:12px;opacity:.9}
.fresh{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--mut);white-space:nowrap}.fresh i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#12a37a}.fresh.mid i{background:#e0a100}.fresh.old i{background:#d64545}
.tab{box-shadow:var(--sh);transition:transform .08s}.tab:active{transform:translateY(1px)}.tab.on{background:var(--grad);border-color:transparent;color:#fff}
.card{border-radius:16px;box-shadow:var(--sh);transition:transform .15s,border-color .15s,box-shadow .15s}.card:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 10px 28px rgba(37,99,235,.18)}
.im{border-radius:12px;background:#fff}.pr{font-size:19px;letter-spacing:-.4px}
.badge{backdrop-filter:blur(4px)}
.addl{position:absolute;right:6px;bottom:6px;background:rgba(255,255,255,.94);border:0;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;color:#0f172a;box-shadow:0 1px 4px rgba(0,0,0,.2)}.addl.on{background:#12a37a;color:#fff}
.warnpill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--warnbg);color:var(--warn);font-weight:600;margin-left:4px}
.box{border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.rep{display:block;font-size:11.5px;color:var(--mut);font-weight:400}
.pri{background:var(--grad);color:#fff;border:0;border-radius:999px;padding:9px 16px;font-weight:700}.sec{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-weight:600;color:var(--tx)}
.li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.li .nm{min-height:0;margin:0}
.tot2{margin-top:12px;padding:12px;border-radius:12px;background:var(--soft)}.tot2 b{font-size:18px}
.live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:800px){.hero{padding:16px}.hero h1{font-size:21px}.li{grid-template-columns:1fr auto}}
</style>
</head>
<body>
<div id="demo"></div>
<header><div class="top">
  <div class="logo">Compará<span>Tech</span></div><nav class="nav" aria-label="Secciones"><a class="on" href="index.html" aria-current="page">Precios</a><a href="armado.html">Armado de PC</a><a href="encontra.html">Encontrá tu equipo</a><a href="comparar.html">Comparar hardware</a></nav>
  <input id="q" type="search" placeholder="Buscar: ryzen 5 5500, rtx 4060, ddr5 32gb…">
  <span class="fresh" id="fresh" title="Cuándo se leyeron los precios de las tiendas"></span><button class="sec" id="lbtn" aria-haspopup="dialog">🛒 Mi lista <span id="lcount">0</span></button>
  <button class="tab" id="fbtn">Filtros</button>
</div></header>
<div class="wrap">
  <aside id="side">
    <h4>Categoría</h4><select id="cat"></select>
    <h4>Precio (ARS)</h4><div class="rng"><input id="pmin" type="number" min="0" placeholder="Mín"><input id="pmax" type="number" min="0" placeholder="Máx"></div>
    <h4>Marca</h4><input id="bq" placeholder="Buscar marca…" style="width:100%;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--tx);margin-bottom:4px"><div class="fl" id="brands"></div><button class="more" id="bmore"></button>
    <h4>Tienda</h4><div class="fl" id="stores"></div>
    <h4>Opciones</h4><div class="fl">
      <label><input type="checkbox" id="stock"> Solo con stock</label>
      <label><input type="checkbox" id="multi"> En 2 o más tiendas</label>
      <label><input type="checkbox" id="lowonly"> En mínimo histórico</label></div>
    <h4>&nbsp;</h4><button class="more" id="reset">Limpiar filtros</button>
  </aside>
  <main>
    <section class="hero" aria-label="Resumen"><div><h1>Hardware al mejor precio, en un solo lugar</h1><p>Comparamos precio, stock y cuotas de las tiendas argentinas y te avisamos cuándo conviene comprar.</p></div><div class="stats" id="stats"></div></section>
    <div id="alert"></div>
    <div class="tabs" id="tabs"></div>
    <div class="summary" id="sum"></div>
    <div class="grid" id="grid"></div>
    <button id="more" style="display:none">Mostrar más</button>
  </main>
</div>
<footer id="foot"></footer><div class="live" id="live" role="status" aria-live="polite"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Detalle"><div class="box" id="box"></div></div>
<script>
const $=s=>document.querySelector(s),ARS=n=>n==null?"—":"$"+Math.round(n).toLocaleString("es-AR");
const CATS={procesadores:"Procesadores",motherboards:"Motherboards","placas-de-video":"Placas de video","memorias-ram":"Memorias RAM",almacenamiento:"Almacenamiento",refrigeracion:"Refrigeración",fuentes:"Fuentes",gabinetes:"Gabinetes",monitores:"Monitores",notebooks:"Notebooks","pcs-armadas":"PCs armadas",perifericos:"Periféricos",redes:"Redes",accesorios:"Cables y accesorios",otros:"Otros"};
const COLORS=["#1f6feb","#e0763a","#12a37a","#b04ad6","#d6a31f","#d64a6a","#4a9ed6"];
let DATA=[],HIST={},META={},CFG={stores:{}};
const S={tab:"todos",cat:"",brands:new Set(),stores:new Set(),pmin:null,pmax:null,stock:false,multi:false,lowonly:false,sort:"price",q:"",shown:48,allBrands:false,bq:""};
const price=o=>o.price_cash??o.price_list,best=g=>price(g.offers[0]);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let FOLLOW={};try{FOLLOW=JSON.parse(localStorage.getItem("seg")||"{}")}catch{}
let LIST=[];try{LIST=JSON.parse(localStorage.getItem("lista")||"[]")}catch{}
const saveL=()=>{try{localStorage.setItem("lista",JSON.stringify(LIST))}catch{}};
let STORES={stores:{}};
const stale=s=>{const m=(META.stores||{})[s];return !!(m&&!m.ok)};   // la tienda no respondió en la última lectura: se muestran datos anteriores
const rep1=s=>{const r=((STORES.stores||{})[s]||{}).reputation||[];return r[0]||null};
const saveF=()=>{try{localStorage.setItem("seg",JSON.stringify(FOLLOW))}catch{}};
async function j(u,d){try{const r=await fetch(u,{cache:"no-cache"});if(!r.ok)throw 0;return await r.json()}catch{return d}}

function visible(g){ // oferta(s) que pasan los filtros de tienda/stock
  return g.offers.filter(o=>(!S.stores.size||S.stores.has(o.store))&&(!S.stock||o.stock!==false));
}
function filtered(skip){
  const q=S.q.toLowerCase().split(/\s+/).filter(Boolean);
  return DATA.filter(g=>{
    if(skip!=="cat"&&S.cat&&g.category!==S.cat)return false;
    if(skip!=="brand"&&S.brands.size&&!S.brands.has(g.brand))return false;
    if(q.length){const n=g.name.toLowerCase();if(!q.every(t=>n.includes(t)))return false}
    const v=visible(g);if(!v.length)return false;
    const p=price(v[0]);if(S.pmin!=null&&p<S.pmin)return false;if(S.pmax!=null&&p>S.pmax)return false;
    if(S.multi&&g.offers.length<2)return false;
    if(S.lowonly&&!g.low)return false;
    if(S.tab==="bajaron"&&!(g.chg&&g.chg.pct<0))return false;
    if(S.tab==="subieron"&&!(g.chg&&g.chg.pct>0))return false;
    if(S.tab==="seguidos"&&!FOLLOW[g.id])return false;
    return true;
  });
}
function sorter(){
  const spread=g=>{const p=g.offers.map(price);return Math.max(...p)-Math.min(...p)};
  const pct=g=>g.chg?g.chg.pct:0;
  return {price:(a,b)=>best(a)-best(b),priceDesc:(a,b)=>best(b)-best(a),down:(a,b)=>pct(a)-pct(b),up:(a,b)=>pct(b)-pct(a),
    stores:(a,b)=>b.offers.length-a.offers.length||best(a)-best(b),spread:(a,b)=>spread(b)-spread(a)}[S.sort];
}
function card(g){
  const o=visible(g)[0]||g.offers[0],c=g.chg;
  const badge=c?`<span class="badge ${c.pct<0?"d":"u"}">${c.pct<0?"▼":"▲"} ${Math.abs(c.pct).toLocaleString("es-AR")}%</span>`:"";
  const f=FOLLOW[g.id]?" on":"";
  return `<div class="card" data-id="${esc(g.id)}"><div class="im">${g.image?`<img loading="lazy" src="${esc(g.image)}" alt="" onerror="this.remove()">`:`<span class="ph">sin imagen</span>`}${badge}<button class="star${f}" data-f="${esc(g.id)}" title="Seguir este producto" aria-label="Seguir precio">${f?"★":"☆"}</button><button class="addl${LIST.includes(g.id)?" on":""}" data-l="${esc(g.id)}" aria-label="${LIST.includes(g.id)?"Quitar de mi lista":"Agregar a mi lista"}">${LIST.includes(g.id)?"✓ En lista":"+ Lista"}</button></div>
  <div class="st">${esc(o.store)}${stale(o.store)?'<span class="warnpill" title="La tienda no respondió en la última lectura: este precio puede estar desactualizado">dato viejo</span>':""}${o.anom?'<span class="warnpill" title="El precio cambió de forma muy brusca: confirmalo en la tienda">precio inusual</span>':""}</div><div class="nm">${esc(g.name)}</div>
  <div class="pr">${ARS(price(o))}${c&&c.pct<0?`<span class="old">${ARS(c.prev)}</span>`:""}</div>
  <div class="sub">${g.offers.length>1?`Comparado en ${g.offers.length} tiendas`:"1 tienda"}${g.low?' · <span class="low">mínimo histórico</span>':""}</div></div>`;
}
function counts(){const t={todos:DATA.length,bajaron:0,subieron:0,seguidos:0};
  DATA.forEach(g=>{if(g.chg)g.chg.pct<0?t.bajaron++:t.subieron++;if(FOLLOW[g.id])t.seguidos++});return t}
function renderSide(){
  const base=filtered("cat"),cc={};base.forEach(g=>cc[g.category]=(cc[g.category]||0)+1);
  $("#cat").innerHTML=`<option value="">Todas (${base.length})</option>`+Object.keys(CATS).filter(k=>cc[k]||S.cat===k).map(k=>`<option value="${k}" ${S.cat===k?"selected":""}>${CATS[k]} (${cc[k]||0})</option>`).join("");
  const bb=filtered("brand"),bc={};bb.forEach(g=>{if(g.brand)bc[g.brand]=(bc[g.brand]||0)+1});
  let bl=Object.entries(bc).sort((a,b)=>b[1]-a[1]);if(S.bq)bl=bl.filter(([b])=>b.toLowerCase().includes(S.bq));
  const total=bl.length;if(!S.allBrands&&!S.bq)bl=bl.slice(0,10);
  $("#brands").innerHTML=bl.map(([b,n])=>`<label><input type="checkbox" data-b="${esc(b)}" ${S.brands.has(b)?"checked":""}> ${esc(b)}<span class="c">${n}</span></label>`).join("");
  $("#bmore").textContent=total>10&&!S.bq?(S.allBrands?"Ver menos":`Ver todas (${total})`):"";
}
function render(){
  const t=counts(),names={todos:"Todos",bajaron:"▼ Bajaron de precio",subieron:"▲ Subieron de precio",seguidos:"★ Seguidos"};
  $("#tabs").innerHTML=Object.keys(names).map(k=>`<button class="tab ${S.tab===k?"on":""}" data-t="${k}">${names[k]}<span class="n">${t[k]}</span></button>`).join("")+
   `<div class="sortw"><span class="sub">Ordenar</span><select id="sort">${[["price","Menor precio"],["priceDesc","Mayor precio"],["down","Mayor baja %"],["up","Mayor suba %"],["stores","Más tiendas"],["spread","Mayor diferencia entre tiendas"]].map(([v,l])=>`<option value="${v}" ${S.sort===v?"selected":""}>${l}</option>`).join("")}</select></div>`;
  $("#sort").onchange=e=>{S.sort=e.target.value;S.shown=48;render()};
  const rows=filtered().sort(sorter());
  $("#sum").textContent=`${rows.length.toLocaleString("es-AR")} resultados`+(S.tab==="bajaron"||S.tab==="subieron"?` · cambios de los últimos ${META.recent_days||14} días`:"");
  $("#grid").innerHTML=rows.slice(0,S.shown).map(card).join("")||`<div class="empty">${S.tab==="seguidos"?"Todavía no seguís productos. Tocá la ☆ de cualquier producto.":S.tab==="todos"?"Sin resultados.":"Todavía no hay cambios de precio registrados. Aparecen a medida que se actualizan los datos."}</div>`;
  $("#more").style.display=rows.length>S.shown?"block":"none";
  renderSide();
}
function alertBox(){
  const ch=Object.entries(FOLLOW).map(([id,f])=>{const g=DATA.find(x=>x.id===id);return g&&{g,f,d:best(g)-f.price}}).filter(x=>x&&Math.abs(x.d)>0);
  const up=ch.filter(x=>x.d>0),dn=ch.filter(x=>x.d<0),ds=DATA.filter(g=>g.chg&&g.chg.pct>0).length;
  let h="";
  if(ch.length)h+=`<div class="alert"><b>Tus productos seguidos:</b> ${up.length?`<span class="up">${up.length} subieron</span>`:""} ${dn.length?`<span class="dn">${dn.length} bajaron</span>`:""} desde que los seguiste. <a href="#" data-t="seguidos">Verlos</a></div>`;
  $("#alert").innerHTML=h;
}
function chart(g){
  const lines=g.offers.map((o,i)=>({o,c:COLORS[i%COLORS.length],s:(HIST[o.k]||[]).map(x=>[x[0],x[1]])})).filter(l=>l.s.length);
  const today=(META.updated||new Date().toISOString()).slice(0,10),D=d=>new Date(d).getTime();
  const all=lines.flatMap(l=>l.s.filter(x=>x[0]).map(x=>D(x[0])));
  const pts=lines.flatMap(l=>l.s.map(x=>x[1]));
  if(!pts.length)return "";
  const t0=Math.min(...all,D(today)-86400000*7),t1=Math.max(D(today),...all);
  const mn=Math.min(...pts),mx=Math.max(...pts),pad=(mx-mn)*.15||mx*.05,lo=mn-pad,hi=mx+pad;
  const W=760,H=230,L=64,R=10,T=10,B=26,X=t=>L+(t-t0)/(t1-t0||1)*(W-L-R),Y=p=>T+(1-(p-lo)/(hi-lo))*(H-T-B);
  let svg=`<svg viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<=3;i++){const p=lo+(hi-lo)*i/3,y=Y(p);svg+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="currentColor" opacity=".12"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="currentColor" opacity=".6">${ARS(p)}</text>`}
  for(let i=0;i<=4;i++){const t=t0+(t1-t0)*i/4;svg+=`<text x="${X(t)}" y="${H-6}" text-anchor="${i==0?"start":i==4?"end":"middle"}" font-size="11" fill="currentColor" opacity=".6">${new Date(t).toLocaleDateString("es-AR",{day:"numeric",month:"short"})}</text>`}
  lines.forEach(l=>{let d="",prev=null;
    const s=l.s.map(x=>[x[0]?D(x[0]):t0,x[1]]);s.push([D(today),s[s.length-1][1]]);
    s.forEach(([t,p],i)=>{d+=i==0?`M${X(t)},${Y(p)}`:`H${X(t)}V${Y(p)}`});
    svg+=`<path d="${d}" fill="none" stroke="${l.c}" stroke-width="2.2" stroke-linejoin="round"/>`;
    const e=s[s.length-1];svg+=`<circle cx="${X(e[0])}" cy="${Y(e[1])}" r="3.5" fill="${l.c}"/>`});
  svg+=`</svg><div class="leg">${lines.map(l=>`<span><i style="background:${l.c}"></i>${esc(l.o.store)}</span>`).join("")}</div>`;
  const n=Math.max(...lines.map(l=>l.s.length));
  const top=g.offers[0],ts=HIST[top.k]||[],tv=ts.map(x=>x[1]);
  const msg=tv.length>=3&&price(top)<=Math.min(...tv)?"Es el precio más bajo registrado de esta tienda.":tv.length?`Precio más bajo registrado en ${esc(top.store)}: ${ARS(Math.min(...tv))}.`:"";
  return `<div class="chart"><b>Historial de precio</b> <span class="sub">${msg} ${n<3?"El historial se va armando con cada actualización.":""}</span>${svg}</div>`;
}
function openModal(id){
  const g=DATA.find(x=>x.id===id);if(!g)return;
  const rows=g.offers.map((o,k)=>{
    const st=o.stock===true?'<span class="in">● Con stock</span>':o.stock===false?'<span class="out">● Sin stock</span>':'<span class="sub">a confirmar</span>';
    const rt=o.rating?` ⭐${o.rating.score}${o.rating.count?` (${o.rating.count})`:""}`:"";
    const ch=o.chg?` <span class="${o.chg.pct<0?"dn":"up"}">${o.chg.pct<0?"▼":"▲"}${Math.abs(o.chg.pct)}%</span>`:"";
    const cu=o.cuotas?esc(o.cuotas):(CFG.stores[o.store]?.cuotas&&o.price_list?`${CFG.stores[o.store].cuotas.n} cuotas${CFG.stores[o.store].cuotas.sin_interes?" sin interés":""} de ${ARS(o.price_list/CFG.stores[o.store].cuotas.n)}`:'<span class="sub">consultar</span>');
    return `<tr class="${k===0?"best":""}"><td><b>${esc(o.store)}</b>${rt}${(()=>{const r=rep1(o.store);return r?`<span class="rep" title="${esc(r.source)} · ficha «${esc(r.listing)}» · consultado el ${esc(r.date)}">★ ${r.score.toLocaleString("es-AR")} en ${esc(r.source)} (${r.count.toLocaleString("es-AR")})</span>`:`<span class="rep">sin reputación verificada</span>`})()}${stale(o.store)?'<span class="warnpill">dato viejo</span>':""}${o.anom?'<span class="warnpill">precio inusual</span>':""}</td><td class="n">${ARS(o.price_cash)}${ch}</td><td class="n">${ARS(o.price_list)}</td><td>${cu}</td><td>${st}</td><td><a target="_blank" rel="noopener nofollow" href="${esc(o.url)}">Ir a la tienda ↗</a></td></tr>`}).join("");
  const c=g.chg,f=!!FOLLOW[g.id];
  $("#box").innerHTML=`<button class="x" id="cx">×</button><div class="mh"><div class="im">${g.image?`<img src="${esc(g.image)}" alt="" onerror="this.remove()">`:""}</div><div><span class="tag">${esc(CATS[g.category]||g.category)}</span>${g.brand?`<span class="tag">${esc(g.brand)}</span>`:""}<h2 style="margin:6px 0">${esc(g.name)}</h2>
  <div class="big">${ARS(best(g))} <span class="sub">en ${esc(g.offers[0].store)}</span></div>
  ${c?`<div class="${c.pct<0?"dn":"up"}">${c.pct<0?"▼ Bajó":"▲ Subió"} ${Math.abs(c.pct)}% (antes ${ARS(c.prev)})</div>`:""}
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="tab ${f?"on":""}" id="fb">${f?"★ Siguiendo":"☆ Seguir precio"}</button><button class="pri" id="fl">${LIST.includes(g.id)?"✓ En mi lista (quitar)":"+ Agregar a mi lista"}</button></div></div></div>
  <table><tr><th>Tienda</th><th class="n">Efectivo / transf.</th><th class="n">Lista / tarjeta</th><th>Cuotas</th><th>Stock</th><th></th></tr>${rows}</table><p class="sub" style="margin:8px 0 0">${(()=>{const rs=g.offers.map(o=>o.store).filter(x=>rep1(x));return rs.length?"La reputación es el puntaje público de cada tienda en una sola plataforma (fecha en el detalle al pasar el mouse); no se promedian fuentes. ":""})()}Los precios no incluyen envío: se calcula en cada tienda.</p>${g.offers.some(o=>o.anom)?'<div class="alert" style="margin-top:10px;border-left-color:var(--warn)">Alguna oferta cambió de precio de forma muy brusca. Puede ser un error de la tienda: confirmalo antes de comprar.</div>':""}${chart(g)}`;
  $("#modal").classList.add("on");
  $("#cx").onclick=()=>$("#modal").classList.remove("on");
  $("#fb").onclick=()=>{toggleF(g.id);openModal(id)};
  $("#fl").onclick=()=>{toggleL(g.id);openModal(id)};
}
function toggleL(id){const i=LIST.indexOf(id);i>=0?LIST.splice(i,1):LIST.push(id);saveL();$("#lcount").textContent=LIST.length;$("#live").textContent=i>=0?"Quitado de tu lista":"Agregado a tu lista";render()}
function openList(){
  const gs=LIST.map(id=>DATA.find(g=>g.id===id)).filter(Boolean);
  const rows=gs.map(g=>{const o=g.offers.filter(x=>x.stock!==false)[0];return {g,o}});
  const sum=rows.filter(r=>r.o).reduce((a,r)=>a+price(r.o),0);
  const common=[...new Set(gs.flatMap(g=>g.offers.map(o=>o.store)))].filter(st=>gs.every(g=>g.offers.some(o=>o.store===st&&o.stock!==false)));
  const per=common.map(st=>({st,t:gs.reduce((a,g)=>a+price(g.offers.find(o=>o.store===st)),0)})).sort((a,b)=>a.t-b.t);
  const nst=new Set(rows.filter(r=>r.o).map(r=>r.o.store)).size;
  $("#box").innerHTML=`<button class="x" id="cx" aria-label="Cerrar">×</button><h2 style="margin:0 0 4px">Mi lista de compra</h2><p class="sub" style="margin:0 0 8px">Se guarda solo en este navegador. Precios con stock confirmado o a confirmar; sin envío.</p>`+
   (gs.length?rows.map(({g,o})=>`<div class="li"><div><div class="nm">${esc(g.name)}</div><div class="sub">${o?`${esc(o.store)}${o.stock===true?"":" · stock a confirmar"}`:"Sin stock en este momento"}</div></div><b>${o?ARS(price(o)):"—"}</b><button class="sec" data-lr="${esc(g.id)}" aria-label="Quitar de la lista">Quitar</button></div>`).join("")+
   `<div class="tot2"><div>Comprando lo más barato de cada producto: <b>${ARS(sum)}</b> <span class="sub">(${nst} ${nst===1?"tienda":"tiendas"}${rows.some(r=>!r.o)?"; faltan productos sin stock":""})</span></div>
   <div style="margin-top:6px">${per.length?`En una sola tienda: <b>${ARS(per[0].t)}</b> en ${esc(per[0].st)}${per.length>1?` <span class="sub">(luego ${esc(per[1].st)}: ${ARS(per[1].t)})</span>`:""}`:`<span class="sub">Ninguna tienda tiene todos los productos con stock.</span>`}</div></div>
   <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="pri" id="lcopy">Copiar lista</button><button class="sec" id="lclear">Vaciar</button></div>`:`<div class="empty">Tu lista está vacía. Tocá «+ Lista» en cualquier producto.</div>`);
  $("#modal").classList.add("on");$("#cx").onclick=()=>$("#modal").classList.remove("on");
  document.querySelectorAll("[data-lr]").forEach(b=>b.onclick=()=>{toggleL(b.dataset.lr);openList()});
  const cl=$("#lclear");if(cl)cl.onclick=()=>{LIST=[];saveL();$("#lcount").textContent=0;render();openList()};
  const cp=$("#lcopy");if(cp)cp.onclick=async()=>{const t=rows.map(({g,o})=>`- ${g.name}: ${o?ARS(price(o))+" ("+o.store+")":"sin stock"}`).join("\n")+`\nTotal: ${ARS(sum)} (sin envío) · ${new Date().toLocaleDateString("es-AR")}`;try{await navigator.clipboard.writeText(t);cp.textContent="¡Copiada!"}catch{cp.textContent="No se pudo copiar"}};
}
function toggleF(id){const g=DATA.find(x=>x.id===id);if(FOLLOW[id])delete FOLLOW[id];else FOLLOW[id]={price:best(g),name:g.name};saveF();alertBox();render()}
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.dataset.f){e.stopPropagation();toggleF(t.dataset.f);return}
  if(t.dataset.l){e.stopPropagation();toggleL(t.dataset.l);return}
  const tb=t.closest("[data-t]");if(tb){e.preventDefault();S.tab=tb.dataset.t;S.shown=48;render();return}
  const c=t.closest(".card");if(c){openModal(c.dataset.id);return}
  if(t.id==="modal")t.classList.remove("on");
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#modal").classList.remove("on")});
function bind(){
  const re=()=>{S.shown=48;render()};
  $("#q").oninput=e=>{S.q=e.target.value;re()};
  $("#cat").onchange=e=>{S.cat=e.target.value;re()};
  const num=v=>v===""?null:Number(v);
  $("#pmin").oninput=e=>{S.pmin=num(e.target.value);re()};$("#pmax").oninput=e=>{S.pmax=num(e.target.value);re()};
  ["stock","multi","lowonly"].forEach(k=>$("#"+k).onchange=e=>{S[k]=e.target.checked;re()});
  $("#brands").onchange=e=>{const b=e.target.dataset.b;e.target.checked?S.brands.add(b):S.brands.delete(b);re()};
  $("#stores").onchange=e=>{const b=e.target.dataset.s;e.target.checked?S.stores.add(b):S.stores.delete(b);re()};
  $("#bq").oninput=e=>{S.bq=e.target.value.toLowerCase();renderSide()};
  $("#bmore").onclick=()=>{S.allBrands=!S.allBrands;renderSide()};
  $("#more").onclick=()=>{S.shown+=48;render()};
  $("#lbtn").onclick=openList;
  $("#fbtn").onclick=()=>$("#side").classList.toggle("show");
  $("#reset").onclick=()=>{Object.assign(S,{cat:"",brands:new Set(),stores:new Set(),pmin:null,pmax:null,stock:false,multi:false,lowonly:false,q:"",bq:""});
    ["q","pmin","pmax","bq"].forEach(i=>$("#"+i).value="");["stock","multi","lowonly"].forEach(i=>$("#"+i).checked=false);re()};
}
(async()=>{
  [DATA,HIST,META,CFG,STORES]=await Promise.all([j("data/products.json",[]),j("data/history.json",{}),j("data/meta.json",{}),j("data/config.json",{stores:{}}),j("data/stores.json",{stores:{}})]);
  $("#lcount").textContent=LIST.length;
  {const h=META.updated?(Date.now()-new Date(META.updated).getTime())/36e5:null,el=$("#fresh");
   el.className="fresh"+(h==null?" old":h>24?" old":h>12?" mid":"");
   el.innerHTML=h==null?"<i></i>Sin fecha de actualización":`<i></i>Actualizado ${h<1?"hace menos de 1 h":h<48?"hace "+Math.round(h)+" h":"hace "+Math.round(h/24)+" días"}`;
   const ok=Object.values(META.stores||{}).filter(m=>m.ok).length,bj=DATA.filter(g=>g.chg&&g.chg.pct<0).length;
   $("#stats").innerHTML=`<div class="stat"><b>${DATA.length.toLocaleString("es-AR")}</b><span>productos</span></div><div class="stat"><b>${ok||Object.keys(META.stores||{}).length}</b><span>tiendas con datos</span></div><div class="stat"><b>${bj}</b><span>bajaron de precio</span></div>`;}
  const sc={};DATA.forEach(g=>g.offers.forEach(o=>sc[o.store]=(sc[o.store]||0)+1));
  $("#stores").innerHTML=Object.keys(META.stores||sc).map(s=>{const m=(META.stores||{})[s];return `<label title="${esc(m&&m.error||"")}"><input type="checkbox" data-s="${esc(s)}"> ${esc(s)}${m&&!m.ok?" ⚠️":""}<span class="c">${sc[s]||0}</span></label>`}).join("");
  const d=META.updated?new Date(META.updated).toLocaleString("es-AR",{dateStyle:"short",timeStyle:"short"}):"—";
  $("#foot").innerHTML=`Actualizado: ${d}. Precios y stock leídos automáticamente de cada tienda, sin garantía: verificá en la tienda antes de comprar. Este sitio no vende productos.`;
  if(META.demo)$("#demo").innerHTML='<div class="demo">Datos de ejemplo (inventados) para probar el diseño.</div>';
  bind();alertBox();render();
})();
</script>
