name: Actualizar precios y publicar

on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # NET Gaming pide 5 s entre pedidos: la corrida completa es más lenta
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probar lectores
        run: python tests/run_tests.py
      - name: Recolectar precios
        run: python build_data.py
      - name: Verificar que los datos sean válidos (si no, no se publica)
        run: python scripts/check_data.py
      - name: Copiar el sitio listo para publicar (antes de tocar git)
        run: cp -r site "$RUNNER_TEMP/site_publicar"
      - name: Guardar datos en el repositorio
        run: |
          git config user.name "actualizador"
          git config user.email "actions@users.noreply.github.com"
          git add site/data raw
          git diff --staged --quiet || git commit -m "Actualización automática de precios"
          # Si el repositorio avanzó mientras corríamos, se une dejando SIEMPRE los datos recién generados.
          # Nunca se usa rebase: un conflicto dejaba marcas «<<<<<<<» dentro de products.json y la web quedaba vacía.
          git fetch origin main || true
          git merge -X ours --no-edit origin/main || git merge --abort || true
          git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site_publicar
      - id: deploy
        uses: actions/deploy-pages@v4
